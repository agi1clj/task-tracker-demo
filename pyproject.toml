[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker-demo"
version = "0.1.0"
description = "A small command-line task tracker that stores tasks in a JSON file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
task-tracker = "task_tracker.cli:main"

[tool.setuptools]
packages = ["task_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
